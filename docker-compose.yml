version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartbank_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartbank2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-smartbank2025}
      JWT_SECRET: ${JWT_SECRET:-changeme32chars_minimum_length_}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh_32chars_minimum}
      AI_SERVICE_URL: http://ai:8000
    ports: ["5000:5000"]
  ai:
    build: ./ai
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-smartbank2025}
    ports: ["8000:8000"]
volumes:
  postgres_data:
